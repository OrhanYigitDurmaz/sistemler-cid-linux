name: Build Debian Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:sid

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            libhidapi-dev \
            libspandsp-dev \
            pkg-config

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        env:
          DEBEMAIL: ci@github-actions
          DEBFULLNAME: CI Build
        run: |
          # Version from git tag or timestamp
          if echo "$GITHUB_REF" | grep -q '^refs/tags/'; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION="0.1.0-$(date +%Y%m%d%H%M%S)"
          fi

          # Update changelog for version
          dch -v "$VERSION" "Automated build" -D unstable

          # Build the package (binary-only, unsigned)
          dpkg-buildpackage -us -uc -b

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cidv6d-packages
          path: artifacts/*
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
